<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - NEXA</title>
    <style>
        /* --- TUS ESTILOS BASE --- */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Montserrat", sans-serif; }
        body { background: linear-gradient(to right, #e2e2e2, #c9d6ff); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; position: relative; overflow-x: hidden; }

        /* Fondo Animado */
        body::before { content: ""; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(0, 196, 255, 0.08) 0%, transparent 70%); z-index: -1; animation: float 15s infinite alternate ease-in-out; }
        @keyframes float { 0% { transform: translate(0, 0); } 50% { transform: translate(-5%, 5%); } 100% { transform: translate(5%, -5%); } }

        /* Tarjeta */
        .password-reset-card { background: #fff; border-radius: 30px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35); width: 100%; max-width: 480px; padding: 3.5rem 3rem; margin: 2rem 0; position: relative; overflow: hidden; }
        .password-reset-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(to right, #00c4ff, #004F78); }

        /* Títulos */
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #004F78; font-weight: 700; font-size: 32px; position: relative; display: inline-block; }
        .logo h1::after { content: ""; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 48px; height: 3px; background: linear-gradient(to right, #00c4ff, #004F78); border-radius: 3px; }
        .password-form h2 { margin-bottom: 10px; color: #004F78; font-size: 24px; text-align: center; font-weight: 700; }
        .password-form p { margin-bottom: 25px; color: #555; text-align: center; font-size: 14px; line-height: 1.5; }

        /* Inputs */
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #004F78; font-size: 14px; }
        .form-group input { width: 100%; height: 45px; background: #f0f8ff; border-radius: 10px; padding: 0 20px; border: 2px solid transparent; font-size: 14px; transition: all 0.3s ease; color: #000; }
        .form-group input:focus { outline: none; border-color: #00c4ff; background: #fff; }

        /* Barra de Seguridad Mejorada */
        .password-strength { margin-top: 12px; display: flex; align-items: center; gap: 8px; }
        .strength-bar { height: 6px; flex: 1; background-color: #e0e0e0; border-radius: 3px; transition: all 0.3s ease; }
        /* Clases dinámicas para JS */
        .strength-bar.weak { background-color: #ff4d4d; }
        .strength-bar.medium { background-color: #ffa64d; }
        .strength-bar.strong { background-color: #2ecc71; }
        .strength-text { font-size: 12px; font-weight: 600; color: #555; min-width: 110px; text-align: right; }

        /* Botones */
        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }

        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #00c4ff, #004F78); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; text-transform: uppercase; transition: transform 0.2s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 196, 255, 0.3); }

        /* Botón Cancelar Nuevo */
        .btn-cancel { width: 100%; padding: 14px; background: #f3f4f6; color: #666; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; text-transform: uppercase; text-align: center; text-decoration: none; transition: all 0.3s; display: block; }
        .btn-cancel:hover { background: #e5e7eb; color: #333; border-color: #999; }

        /* Alertas */
        .alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 14px; font-weight: 600; }
        .alert-success { background-color: #dcfce7; color: #166534; border: 1px solid #22c55e; }
        .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
</head>
<body>
<div class="password-reset-card">
    <div class="logo">
        <h1>NEXA</h1>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form class="password-form" th:action="@{/profile/change-password}" method="post">
        <h2>Cambiar Contraseña</h2>
        <p>Ingresa tu contraseña actual para confirmar tu identidad.</p>

        <div class="form-group">
            <label for="currentPassword">Contraseña Actual</label>
            <input type="password" id="currentPassword" name="currentPassword" placeholder="Tu contraseña actual" required>
        </div>

        <div class="form-group">
            <label for="newPassword">Nueva Contraseña</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="Mínimo 8 caracteres" required>
            <div class="password-strength">
                <span class="strength-bar" id="bar1"></span>
                <span class="strength-bar" id="bar2"></span>
                <span class="strength-bar" id="bar3"></span>
                <span class="strength-text" id="strengthText">Seguridad: ...</span>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar Nueva Contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite la nueva contraseña" required>
        </div>

        <div class="btn-container">
            <button type="submit" class="btn-submit">Actualizar Contraseña</button>

            <a sec:authorize="hasRole('PASAJERO')" th:href="@{/pasajero/panel}" class="btn-cancel">
                Cancelar y Volver
            </a>

            <a sec:authorize="hasRole('CONDUCTOR')" th:href="@{/conductor/panel}" class="btn-cancel">
                Cancelar y Volver
            </a>

            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn-cancel">
                Cancelar y Volver
            </a>
        </div>
    </form>
</div>

<script>
    // Script de fortaleza mejorado
    document.getElementById('newPassword').addEventListener('input', function() {
        const password = this.value;
        const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3')];
        const strengthText = document.getElementById('strengthText');

        // Reset
        bars.forEach(bar => bar.className = 'strength-bar');

        if (password.length === 0) {
            strengthText.textContent = 'Seguridad: ...';
            strengthText.style.color = '#555';
            return;
        }

        // Lógica de puntuación simple
        let score = 0;
        if (password.length >= 8) score++;
        if (password.match(/[A-Z]/)) score++;
        if (password.match(/[0-9]/)) score++;
        if (password.match(/[^A-Za-z0-9]/)) score++;

        // Determinar estado
        let level = 'weak';
        let label = 'Baja';
        let color = '#ff4d4d';
        let activeCount = 1;

        if (score >= 3) {
            level = 'medium';
            label = 'Media';
            color = '#ffa64d';
            activeCount = 2;
        }
        if (score >= 4) {
            level = 'strong';
            label = 'Alta';
            color = '#2ecc71';
            activeCount = 3;
        }

        // Aplicar clases
        for(let i = 0; i < activeCount; i++) {
            bars[i].classList.add(level);
        }

        strengthText.textContent = `Seguridad: ${label}`;
        strengthText.style.color = color;
    });
</script>
</body>
</html>
