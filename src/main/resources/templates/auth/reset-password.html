<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - NEXA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Montserrat", sans-serif;
        }

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

        body {
            background: linear-gradient(to right, #e2e2e2, #c9d6ff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 196, 255, 0.08) 0%, transparent 70%);
            z-index: -1;
            animation: float 15s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-5%, 5%); }
            100% { transform: translate(5%, -5%); }
        }

        .password-reset-card {
            background: #fff;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 480px;
            padding: 3.5rem 3rem;
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .password-reset-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(to right, #00c4ff, #004F78);
        }

        .password-reset-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 196, 255, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            color: #004F78;
            font-weight: 700;
            font-size: 32px;
            letter-spacing: -0.75px;
            position: relative;
            display: inline-block;
        }

        .logo h1::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 3px;
            background: linear-gradient(to right, #00c4ff, #004F78);
            border-radius: 3px;
        }

        .password-form h2 {
            margin-bottom: 20px;
            color: #004F78;
            font-size: 28px;
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .password-form p {
            margin-bottom: 32px;
            color: #555;
            text-align: center;
            font-size: 16px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 28px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #004F78;
            font-size: 15px;
            position: relative;
            padding-bottom: 8px;
        }

        .form-group label::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 45px;
            height: 2.5px;
            background: #00c4ff;
            border-radius: 2px;
        }

        .form-group input {
            width: 100%;
            height: 45px;
            background: #5ebdda;
            border-radius: 10px;
            padding: 0 20px;
            border: none;
            font-size: 14px;
            transition: all 0.3s ease;
            color: #000;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 196, 255, 0.3);
            background: #4dacc9;
        }

        .form-group input::placeholder {
            color: rgba(0, 0, 0, 0.6);
        }

        .password-strength {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .strength-bar {
            height: 6px;
            flex: 1;
            background-color: #e0e0e0;
            border-radius: 3px;
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        .strength-bar.active {
            background-color: #ff4d4d;
        }

        .strength-bar.active.medium {
            background-color: #ffa64d;
        }

        .strength-bar.active.strong {
            background-color: #66cc66;
        }

        .strength-bar.active.very-strong {
            background-color: #2ecc71;
        }

        .strength-text {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            min-width: 110px;
            text-align: right;
            transition: color 0.3s ease;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00c4ff, #004F78);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(0, 196, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 196, 255, 0.5);
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-to-login {
            text-align: center;
            margin-top: 28px;
        }

        .back-to-login a {
            color: #004F78;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-to-login a:hover {
            color: #00c4ff;
        }

        .back-to-login a svg {
            transition: transform 0.3s ease;
        }

        .back-to-login a:hover svg {
            transform: translateX(-3px);
        }

        .alert {
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 28px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            border: 2px solid;
            position: relative;
            overflow: hidden;
        }

        .alert::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .alert-success {
            background-color: rgba(220, 252, 231, 0.4);
            color: #166534;
            border-color: #22c55e;
        }

        .alert-success::before {
            background-color: #22c55e;
        }

        .alert-error {
            background-color: rgba(254, 226, 226, 0.4);
            color: #991b1b;
            border-color: #ef4444;
        }

        .alert-error::before {
            background-color: #ef4444;
        }

        @media (max-width: 600px) {
            .password-reset-card {
                padding: 40px 28px;
                border-radius: 20px;
            }

            body::before {
                animation: none;
            }

            .logo h1 {
                font-size: 28px;
            }

            .password-form h2 {
                font-size: 24px;
            }

            .form-group input {
                padding: 0 16px;
            }

            .btn-submit {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
<div class="password-reset-card">
    <div class="logo">
        <h1>NEXA</h1>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form class="password-form" th:action="@{/auth/reset-password}" method="post">
        <h2>Restablecer Contraseña</h2>
        <p>Crea una nueva contraseña para tu cuenta.</p>

        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group">
            <label for="newPassword">Nueva Contraseña</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="Mínimo 8 caracteres" required>
            <div class="password-strength">
                <span class="strength-bar" id="bar1"></span>
                <span class="strength-bar" id="bar2"></span>
                <span class="strength-bar" id="bar3"></span>
                <span class="strength-text" id="strengthText">Seguridad: baja</span>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar Contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu nueva contraseña" required>
        </div>

        <button type="submit" class="btn-submit">Restablecer Contraseña</button>

        <div class="back-to-login">
            <a th:href="@{/auth/login}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Volver al inicio de sesión
            </a>
        </div>
    </form>
</div>

<script>
    // Validación de fortaleza de contraseña en tiempo real
    document.getElementById('newPassword').addEventListener('input', function() {
        const password = this.value;
        const bar1 = document.getElementById('bar1');
        const bar2 = document.getElementById('bar2');
        const bar3 = document.getElementById('bar3');
        const strengthText = document.getElementById('strengthText');

        // Reset
        bar1.className = 'strength-bar';
        bar2.className = 'strength-bar';
        bar3.className = 'strength-bar';

        if (password.length === 0) {
            strengthText.textContent = 'Seguridad: baja';
            strengthText.style.color = '#555';
            return;
        }

        // Calcular fortaleza
        let strength = 0;
        if (password.length >= 8) strength++;
        if (password.match(/[A-Z]/)) strength++;
        if (password.match(/[0-9]/)) strength++;
        if (password.match(/[^A-Za-z0-9]/)) strength++;

        // Actualizar UI
        const colors = ['#ff4d4d', '#ffa64d', '#66cc66', '#2ecc71'];
        const labels = ['baja', 'media', 'fuerte', 'muy fuerte'];
        const classes = ['', 'medium', 'strong', 'very-strong'];

        if (strength >= 1) {
            bar1.className = 'strength-bar active ' + classes[strength - 1];
        }
        if (strength >= 2) {
            bar2.className = 'strength-bar active ' + classes[strength - 1];
        }
        if (strength >= 3) {
            bar3.className = 'strength-bar active ' + classes[strength - 1];
        }

        strengthText.textContent = `Seguridad: ${labels[strength - 1] || 'baja'}`;
        strengthText.style.color = colors[strength - 1] || '#555';
    });

    // Validación de coincidencia de contraseñas
    document.querySelector('form').addEventListener('submit', function(e) {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            e.preventDefault();
            alert('Las contraseñas no coinciden');
            return;
        }

        if (newPassword.length < 8) {
            e.preventDefault();
            alert('La contraseña debe tener al menos 8 caracteres');
            return;
        }
    });
</script>
</body>
</html>
