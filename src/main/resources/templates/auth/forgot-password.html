<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #c9d6ff;
            background: linear-gradient(to right, #e2e2e2, #c9d6ff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .password-reset-container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 500px;
            padding: 50px 40px;
            border-top: 5px solid #00c4ff;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #00c4ff, #004F78);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #004F78;
            margin-bottom: 15px;
        }

        .form-header p {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-success {
            background: #e6ffed;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .alert-error {
            background: #ffe6e6;
            color: #d32f2f;
            border-left: 4px solid #f44336;
        }

        .alert::before {
            content: "✓";
            font-size: 18px;
            font-weight: 700;
        }

        .alert-error::before {
            content: "✕";
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #004F78;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .input-container {
            position: relative;
        }

        .input-container input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s ease;
            background-color: #f8f9fa;
        }

        .input-container input:focus {
            outline: none;
            border-color: #00c4ff;
            box-shadow: 0 0 0 3px rgba(0, 196, 255, 0.1);
            background-color: white;
        }

        .input-container input::placeholder {
            color: #999;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: #5ebdda;
            color: #333333;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(94, 189, 218, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #00c4ff;
            color: #f8faff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 196, 255, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 196, 255, 0.3);
        }

        .back-to-login {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e0e0e0;
        }

        .back-to-login a {
            color: #00c4ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .back-to-login a:hover {
            color: #004F78;
            transform: translateX(-3px);
        }

        .back-to-login a::before {
            content: "←";
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .back-to-login a:hover::before {
            transform: translateX(-3px);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e0e0e0;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 13px;
        }

        .feature-item i {
            color: #00c4ff;
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .password-reset-container {
                padding: 40px 25px;
                border-radius: 20px;
            }

            .logo h1 {
                font-size: 30px;
            }

            .form-header h2 {
                font-size: 24px;
            }

            .form-header p {
                font-size: 14px;
            }

            .features {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            .btn-submit {
                padding: 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="password-reset-container">
    <div class="logo">
        <h1>NEXA</h1>
    </div>

    <div class="form-header">
        <h2>Recuperar Contraseña</h2>
        <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}">
        Enlace enviado exitosamente
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}">
        Error al enviar el enlace
    </div>

    <form class="password-form" th:action="@{/auth/forgot-password}" method="post">
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-container">
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                        autocomplete="email">
            </div>
        </div>

        <button type="submit" class="btn-submit">Enviar Enlace</button>
    </form>

    <div class="features">
        <div class="feature-item">
            <i>🔒</i>
            <span>Seguro</span>
        </div>
        <div class="feature-item">
            <i>⚡</i>
            <span>Rápido</span>
        </div>
        <div class="feature-item">
            <i>✓</i>
            <span>Confiable</span>
        </div>
    </div>

    <div class="back-to-login">
        <a th:href="@{/auth/login}">Volver al inicio de sesión</a>
    </div>
</div>
</body>
</html>
