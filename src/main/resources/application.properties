spring.application.name=MotvirsWeb

motvirs.model.path=modelo_satisfaccion_j48_v2.0.model

# Configuracion principal de MongoDB (Usa variable de entorno)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/motvirsweb}

# Logging (agregar para debugging del modelo)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=TRACE
logging.level.com.example.MotvirsWeb.Service.SatisfaccionClienteService=INFO

app.base-url=${APP_BASE_URL:}

# Configuracion de correo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:nexabikeservice@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

debug=true
# configuracion de jwt para consumo
jwt.expiration=86400000
# Configuracion de JWT (Obligatorio en entorno)
jwt.secret=${JWT_SECRET}

# Configuracion de Gemini AI Chatbot (Obligatorio en entorno)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Integración de Cloudflare Turnstile (Captcha Invisible)
turnstile.site-key=${TURNSTILE_SITE_KEY}
turnstile.secret-key=${TURNSTILE_SECRET_KEY}
